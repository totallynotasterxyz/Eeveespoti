name: Build Combined Eevee + spoti.pw IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify 9.1.78 IPA"
        required: true
        type: string

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout spoti.pw (for the proper build)
        uses: actions/checkout@v4
        with:
          repository: skopevoj/spoti.pw
          path: spotipw
          ref: main

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download Spotify IPA
        run: |
          mkdir -p spotipw/ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o spotipw/ipa/spotify.ipa
          file spotipw/ipa/spotify.ipa

      - name: Build spoti.pw the official way (make release)
        working-directory: spotipw
        run: |
          make release
          ls -lh out/

      - name: Download latest EeveeSpotifyReincarnated
        run: |
          mkdir -p debs
          # Find the arm64 deb from latest release
          curl -sL https://api.github.com/repos/SideloadLabs/EeveeSpotifyReincarnated/releases/latest -o eevee.json
          EEVEE_URL=$(python3 -c "
import json,sys
data=json.load(open('eevee.json'))
for a in data['assets']:
    if a['name'].endswith('iphoneos-arm64.deb'):
        print(a['browser_download_url'])
        break
")
          echo "Eevee URL: $EEVEE_URL"
          curl -L -o debs/eevee.deb "$EEVEE_URL"
          ls -lh debs/

      - name: Inject Eevee on top of the official spoti.pw IPA
        run: |
          mkdir -p final
          # Take the IPA that spoti.pw just built and inject Eevee
          cyan -i spotipw/out/*.ipa \
               -o final/EeveeSpoti.ipa \
               -f debs/eevee.deb \
               -u -w
          ls -lh final/

      - name: Upload final combined IPA
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpoti-LiquidGlass
          path: final/*.ipa
          retention-days: 5
