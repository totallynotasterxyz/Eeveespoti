name: Build EeveeSpoti

on:
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos
  IPA_URL: "https://files.catbox.moe/vqck7m.ipa"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: skopevoj/spoti.pw
          path: spotipw

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p spotipw/ipa
          curl -fsSL "$IPA_URL" -o spotipw/ipa/spotify.ipa
          file spotipw/ipa/spotify.ipa
          ls -lh spotipw/ipa/

      - name: Build spoti.pw
        working-directory: spotipw
        run: make release

      - name: Get Eevee
        run: |
          mkdir -p debs
          curl -sL https://api.github.com/repos/SideloadLabs/EeveeSpotifyReincarnated/releases/latest -o eevee.json
          python3 -c '
import json
data = json.load(open("eevee.json"))
for a in data["assets"]:
    if "iphoneos-arm64.deb" in a["name"]:
        open("eevee_url.txt", "w").write(a["browser_download_url"])
        break
'
          curl -L -o debs/eevee.deb "$(cat eevee_url.txt)"
          ls -lh debs/

      - name: Inject Eevee
        run: |
          mkdir -p final
          cyan -i spotipw/out/*.ipa -o final/EeveeSpoti.ipa -f debs/eevee.deb -u -w
          ls -lh final/

      - uses: actions/upload-artifact@v4
        with:
          name: EeveeSpoti
          path: final/*.ipa
