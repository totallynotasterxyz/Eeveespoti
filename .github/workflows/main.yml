name: Build EeveeSpoti

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct link to decrypted Spotify 9.1.78 IPA
        required: true
        type: string

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: skopevoj/spoti.pw
          path: spotipw

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p spotipw/ipa
          curl -fsSL "${{ inputs.ipa_url }}" -o spotipw/ipa/spotify.ipa

      - name: Build spoti.pw
        working-directory: spotipw
        run: make release

      - name: Get Eevee
        run: |
          mkdir -p debs
          curl -sL https://api.github.com/repos/SideloadLabs/EeveeSpotifyReincarnated/releases/latest -o eevee.json
          python3 -c '
import json
data = json.load(open("eevee.json"))
for a in data["assets"]:
    if "iphoneos-arm64.deb" in a["name"]:
        open("eevee_url.txt", "w").write(a["browser_download_url"])
        break
'
          curl -L -o debs/eevee.deb "$(cat eevee_url.txt)"

      - name: Inject Eevee
        run: |
          mkdir -p final
          cyan -i spotipw/out/*.ipa -o final/EeveeSpoti.ipa -f debs/eevee.deb -u -w

      - uses: actions/upload-artifact@v4
        with:
          name: EeveeSpoti
          path: final/*.ipa
